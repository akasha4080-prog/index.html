<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin-top: 60px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #374151;
            color: white;
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9ca3af;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        #answer {
            margin-top: 25px;
            padding: 20px;
            background: #1f2937;
            border-radius: 10px;
            min-height: 100px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 My AI Assistant</h1>

    <div class="subtitle">
        Powered by Groq
    </div>

    <label>Groq API Key</label>

    <input
        type="password"
        id="apiKey"
        placeholder="Paste your gsk_... key here"
    >

    <label>Your Question</label>

    <textarea
        id="question"
        placeholder="Ask me anything..."
    ></textarea>

    <button onclick="askAI()">
        Ask AI 🚀
    </button>

    <div id="answer">
        Your answer will appear here...
    </div>

</div>


<script>

async function askAI() {

    const apiKey =
        document.getElementById("apiKey").value.trim();

    const question =
        document.getElementById("question").value.trim();

    const answer =
        document.getElementById("answer");


    // Check API key
    if (!apiKey) {
        answer.innerText =
            "⚠️ Please enter your Groq API key.";
        return;
    }


    // Check question
    if (!question) {
        answer.innerText =
            "⚠️ Please type a question.";
        return;
    }


    answer.innerText =
        "🤔 Thinking...";


    try {

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + apiKey
                },

                body: JSON.stringify({

                    model: "llama-3.3-70b-versatile",

                    messages: [
                        {
                            role: "system",
                            content:
                                "You are a helpful AI assistant. Give clear, accurate and easy-to-understand answers."
                        },
                        {
                            role: "user",
                            content: question
                        }
                    ],

                    temperature: 0.7

                })
            }
        );


        const data = await response.json();


        // Handle errors
        if (!response.ok) {

            answer.innerText =
                "❌ Error:\n" +
                (data.error?.message ||
                "Something went wrong.");

            return;
        }


        // Display AI answer
        answer.innerText =
            data.choices[0].message.content;


    } catch (error) {

        answer.innerText =
            "❌ Connection error:\n" +
            error.message;

    }

}

</script>

</body>
</html>
